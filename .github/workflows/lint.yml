name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# File selection is written as explicit if/then accumulators rather than
# `grep -q X && printf ...`: the latter makes the command substitution inherit
# the exit status of the LAST iteration, and under `bash -e` that fails the
# step whenever the alphabetically-last file is not of the type being selected.

jobs:
  shellcheck:
    name: shellcheck (bash + sh tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Collect shell files
        id: files
        run: |
          files=""
          for f in install.sh uninstall.sh $(find components -type f ! -name '*.md' ! -name '*.zsh' ! -name '*.in' ! -name '*.plist.in' ! -name '*.mobileconfig*' ! -name '*.js' ! -name '*.bash'); do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -qE '^#!.*\b(bash|sh)\b'; then files="$files $f"; fi
          done
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "checking:$files"

      - name: Extract the warp-killswitch helper embedded in its installer
        run: |
          sed -n '/^\$CAT > "\$HELPER" <<.HELPER_EOF.$/,/^HELPER_EOF$/p' components/warp-killswitch/install.sh \
            | sed '1d;$d' > /tmp/warp-killswitch-helper.sh
          test -s /tmp/warp-killswitch-helper.sh

      - name: Syntax check
        run: |
          for f in ${{ steps.files.outputs.files }} /tmp/warp-killswitch-helper.sh; do
            if head -1 "$f" | grep -q bash; then bash -n "$f"; else sh -n "$f"; fi
          done

      - name: ShellCheck (warnings are fatal)
        run: |
          # The tree is clean at warning level. Intentional word splitting carries
          # an inline `shellcheck disable=SC2046` with its reason, so a new warning
          # here means new code, not legacy noise.
          shellcheck -S warning ${{ steps.files.outputs.files }} /tmp/warp-killswitch-helper.sh

      - name: ShellCheck style (informational)
        continue-on-error: true
        run: shellcheck -S style ${{ steps.files.outputs.files }} /tmp/warp-killswitch-helper.sh || true

  zsh:
    name: zsh syntax (shell component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: zsh -n
        run: |
          for f in components/checkdns/*.zsh; do zsh -n "$f"; done
          # the plugin is bash, but it is the file xbar runs — check it too
          bash -n components/menubar/security-toggle.5s.sh

  plists:
    name: property lists and profiles are well-formed XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libxml2
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: xmllint
        run: |
          for f in components/profiles/*.mobileconfig*; do sed "s/@[A-Z_]*@/x/g" "$f" | xmllint --noout -; done
          # the launchd template has @BASH@/@HOME@ placeholders; it is still XML
          xmllint --noout components/netwatch/com.netwatch.plist.in

  license:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every tool carries an SPDX MIT header
        run: |
          missing=0
          for f in install.sh uninstall.sh $(find components -type f ! -name '*.md' ! -name '*.plist.in' ! -name '*.mobileconfig*' ! -name '*.js*'); do
            [ -f "$f" ] || continue
            if ! grep -q 'SPDX-License-Identifier: MIT' "$f"; then
              echo "MISSING LICENSE: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then echo "all tools licensed"; fi
          exit "$missing"
