name: lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# File selection is written as explicit if/then accumulators rather than
# `grep -q X && printf ...`: the latter makes the command substitution inherit
# the exit status of the LAST iteration, and under `bash -e` that fails the
# step whenever the alphabetically-last file is not of the type being selected.

jobs:
  shellcheck:
    name: shellcheck (bash + sh tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned to a commit, not a movable tag (4.1 CVE/supply-chain scrub)

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Collect shell files
        id: files
        run: |
          files=""
          for f in install.sh uninstall.sh lib/common.sh lib/pkg.sh $(find components -type f ! -name '*.md' ! -name '*.zsh' ! -name '*.in' ! -name '*.plist.in' ! -name '*.mobileconfig*' ! -name '*.js' ! -name '*.bash'); do
            [ -f "$f" ] || continue
            if head -1 "$f" | grep -qE '^#!.*\b(bash|sh)\b'; then files="$files $f"; fi
          done
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "checking:$files"

      - name: Syntax check
        run: |
          # components/warp-killswitch/warp-killswitch (the root helper) is in the list:
          # since 4.1 it is its own file, no longer a heredoc inside its installer.
          for f in ${{ steps.files.outputs.files }}; do
            if head -1 "$f" | grep -q bash; then bash -n "$f"; else sh -n "$f"; fi
          done
          echo "${{ steps.files.outputs.files }}" | grep -q 'components/warp-killswitch/warp-killswitch' || { echo "helper missing from lint set"; exit 1; }

      - name: ShellCheck (warnings are fatal)
        run: |
          # The tree is clean at warning level. Intentional word splitting carries
          # an inline `shellcheck disable=SC2046` with its reason, so a new warning
          # here means new code, not legacy noise.
          shellcheck -S warning ${{ steps.files.outputs.files }}

      - name: No calls to helpers that lib/common.sh no longer defines
        run: |
          # 4.1 moved the colour helpers into lib/common.sh as red/grn/ylw; the kill-switch
          # installer kept calling c_red/c_grn/c_ylw until 4.2.1. shellcheck does not flag
          # calls to undefined functions, so this does.
          if grep -rnE '\bc_(red|grn|ylw|hdr|die)\b' ${{ steps.files.outputs.files }}; then
            echo "call to a removed helper name — use red/grn/ylw/hdr/die from lib/common.sh"; exit 1
          fi
          echo "clean"

      - name: ShellCheck style (informational)
        continue-on-error: true
        run: shellcheck -S style ${{ steps.files.outputs.files }} || true

  zsh:
    name: zsh syntax (shell component)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned to a commit, not a movable tag (4.1 CVE/supply-chain scrub)
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: zsh -n
        run: |
          for f in components/checkdns/*.zsh; do zsh -n "$f"; done
          # the plugin is bash, but it is the file xbar runs — check it too
          bash -n components/menubar/security-toggle.5s.sh

  plists:
    name: property lists and profiles are well-formed XML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned to a commit, not a movable tag (4.1 CVE/supply-chain scrub)
      - name: Install libxml2
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: xmllint
        run: |
          for f in components/profiles/*.mobileconfig*; do sed "s/@[A-Z_]*@/x/g" "$f" | xmllint --noout -; done
          # the launchd template has @BASH@/@HOME@ placeholders; it is still XML
          xmllint --noout components/netwatch/com.netwatch.plist.in

  sudoers:
    name: sudoers templates render to rules visudo accepts, with no wildcards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned to a commit, not a movable tag (4.1 CVE/supply-chain scrub)
      - name: Render as install.sh does and validate
        run: |
          set -e
          for f in components/sudoers/*.in; do
            sed -e 's|@USER@|alice|g' -e 's|@DNS_ON@|94.140.14.140 94.140.14.141 9.9.9.9 1.1.1.2|g' \
                -e 's|@DNS_OFF@|9.9.9.9 1.1.1.2|g' "$f" > /tmp/rule
            sudo visudo -cf /tmp/rule
            # A wildcard in a NOPASSWD argument list is exactly what the 4.1 audit removed.
            if grep -v '^#' /tmp/rule | grep -q '[*?]'; then echo "wildcard in $f"; exit 1; fi
          done
          # The kill-switch sudoers rule its installer generates, rendered the same way
          sed -n "s|^    printf '%s ALL=(root) NOPASSWD: \(.*\)\\\\n' .*|alice ALL=(root) NOPASSWD: \1|p" components/warp-killswitch/install.sh \
            | sed 's|%s|/Library/PrivilegedHelperTools/warp-killswitch|g' > /tmp/ks-rule
          test -s /tmp/ks-rule && cat /tmp/ks-rule && sudo visudo -cf /tmp/ks-rule
          if grep -q '[*?]' /tmp/ks-rule; then echo "wildcard in kill-switch rule"; exit 1; fi

  notifications:
    name: no shell text spliced into AppleScript source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned to a commit, not a movable tag (4.1 CVE/supply-chain scrub)
      - name: osascript gets text as arguments only
        run: |
          # `display notification "$var"` built by the shell was the 4.1 audit's injection
          # finding (SSIDs are attacker-chosen). Every call must pass text via `on run argv`.
          if grep -rnE 'osascript .*-e "display (notification|dialog) \\"\$' --include='*.sh' --include=netwatch --include=nettop --include=netcheck --include=probesource .; then
            echo "shell variable interpolated into AppleScript source — pass it as an argument"; exit 1
          fi
          echo "clean"

  license:
    name: license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pinned to a commit, not a movable tag (4.1 CVE/supply-chain scrub)
      - name: Every tool carries an SPDX MIT header
        run: |
          missing=0
          for f in install.sh uninstall.sh lib/common.sh lib/pkg.sh $(find components -type f ! -name '*.md' ! -name '*.plist.in' ! -name '*.mobileconfig*' ! -name '*.js*'); do
            [ -f "$f" ] || continue
            if ! grep -q 'SPDX-License-Identifier: MIT' "$f"; then
              echo "MISSING LICENSE: $f"
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then echo "all tools licensed"; fi
          exit "$missing"
